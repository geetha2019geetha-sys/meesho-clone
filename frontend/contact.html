
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Shop</title>
  <link rel="stylesheet" href="style.css">
</head>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Playwrite+NO:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  

<style>

body{
    margin:0;
    padding:0;
    font-family:Poppins;

    background-image:url("img/bg.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

/* CHECKOUT BOX */
.checkout-box{
    width:90%;
    max-width:500px;
    margin:50px auto;
    background:rgba(255,255,255,0.9);
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}


/* CHECKOUT BOX */
.checkout-box{
    width:90%;
    max-width:500px;
    margin:50px auto;
    background:rgba(255,255,255,0.9);
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

/* TITLE */
.checkout-box h2{
    text-align:center;
    margin-bottom:30px;
    color:purple;
    font-size:35px;
}

/* INPUTS */
.checkout-box input{
    width:100%;
    padding:15px;
    margin-bottom:25px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

/* BUTTON */
.checkout-box button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    background:purple;
    color:white;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
}

/* BACK BUTTON */
.back-btn{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    background:black;
    color:white;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
}

.back-btn:hover{
    background:#333;
}
</style>
<body>
     
<!-- HEADER -->
<div class="header">

    <div class="top-nav">

        <div class="logo-section">
            <img src="img/logo.jpg" class="logo">
            <h1>Viji Boutique</h1>
        </div>

        <!-- RIGHT SIDE -->
        <div class="right-menu">

            <div class="menu-item">
                👤
                <p>Profile</p>
            </div>

            <div class="menu-item">
                🛒
                <p><button onclick="viewCart()" class="cart-btn">🛒 Add to Cart</button></p>
            </div>

        </div>

    </div>

</div>



  <!-- CHECKOUT FORM -->

  <center>
<div class="checkout-box">

  <h2>Checkout Page</h2>

  <input type="text" id="name" placeholder="Enter your name">

  <input type="text" id="address" placeholder="Enter your address">

  <input type="text" id="phone" placeholder="Enter your phone">

  <input type="text" id="productId" readonly><br>


  <button onclick="placeOrder()">Place Order</button>

</div>

<button onclick="goBack()" class="back-btn">⬅ Back to Shop</button>
</center>

<script>

const params = new URLSearchParams(window.location.search);

document.getElementById("productId").value = params.get("id");

function placeOrder() {

    const productId = params.get("id");

    const name = document.getElementById("name").value;

    const address = document.getElementById("address").value;

    const phone = document.getElementById("phone").value;

    if (!name || !address || !phone) {

        alert("Please fill all details");
        return;
    }

    const orderData = {
        productId,
        name,
        address,
        phone
    };

    fetch("http://localhost:5000/order", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(orderData)

    })

    .then(res => res.json())

    .then(() => alert("Order Placed Successfully 🎉"))

    .catch(err => console.log(err));
}


function goBack(){

    window.location.href = "index.html";

}
</script>
  
</body>
</html>
